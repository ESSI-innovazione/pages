<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>TimeVision</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fafafa; color: #262626;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
    .card { width: 100%; max-width: 380px; background: #fff; border: 1px solid #e5e5e5; border-radius: 16px; padding: 32px 28px;
      box-shadow: 0 10px 30px -20px rgba(79,70,229,.4); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; margin-bottom: 20px; }
    .brand span { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg,#6366f1,#4338ca); display: inline-block; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p.sub { color: #737373; font-size: 14px; margin: 0 0 22px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
    input { width: 100%; box-sizing: border-box; font: inherit; padding: 10px 12px; border: 1px solid #d4d4d4; border-radius: 10px; margin-bottom: 14px; }
    input:focus { outline: 2px solid rgba(79,70,229,.35); border-color: #4f46e5; }
    button { width: 100%; font: inherit; font-weight: 600; padding: 11px; border: 0; border-radius: 10px; background: #4f46e5; color: #fff; cursor: pointer; }
    button:hover { background: #4338ca; }
    button[disabled] { opacity: .6; cursor: default; }
    .err { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; }
    .foot { color: #a3a3a3; font-size: 12px; margin: 18px 0 0; text-align: center; }
    .muted { color: #737373; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="card" id="loading">
    <div class="brand"><span aria-hidden="true"></span> TimeVision</div>
    <p class="muted" style="margin:0">Caricamento...</p>
  </div>

  <form class="card" id="login" hidden>
    <div class="brand"><span aria-hidden="true"></span> TimeVision</div>
    <h1>Accedi per vedere la pagina</h1>
    <p class="sub">Riservato ai colleghi con un indirizzo @timevision.it.</p>
    <div class="err" id="error" role="alert" hidden></div>
    <label for="email">Email aziendale</label>
    <input id="email" type="email" autocomplete="email" placeholder="nome.cognome@timevision.it" required />
    <label for="password">Password del team</label>
    <input id="password" type="password" autocomplete="current-password" required />
    <button type="submit" id="submit">Accedi</button>
    <p class="foot">Pagine interne TimeVision. Nessuna registrazione.</p>
  </form>

  <div class="card" id="notfound" hidden>
    <div class="brand"><span aria-hidden="true"></span> TimeVision</div>
    <h1>Pagina non trovata</h1>
    <p class="sub" style="margin:0">Controlla il link che ti è stato inviato.</p>
  </div>

  <script>
    (function () {
      var API = "https://timevision-pages.vercel.app";
      var BASE = "/pages/";
      var KEY = "tvp_token";

      var loading = document.getElementById("loading");
      var login = document.getElementById("login");
      var notfound = document.getElementById("notfound");
      var error = document.getElementById("error");
      var submit = document.getElementById("submit");

      function show(el) {
        [loading, login, notfound].forEach(function (x) { x.hidden = x !== el; });
      }

      function slug() {
        var p = location.pathname;
        var s = p.indexOf(BASE) === 0 ? p.slice(BASE.length) : "";
        s = s.replace(/\/+$/, "").replace(/\.html$/, "");
        if (!s) s = new URLSearchParams(location.search).get("p") || location.hash.slice(1);
        return /^[A-Za-z0-9._-]+$/.test(s) ? s : "";
      }

      var page = slug();
      if (!page) { show(notfound); return; }

      function fail(msg) {
        error.textContent = msg;
        error.hidden = false;
        show(login);
        submit.disabled = false;
      }

      function load() {
        var token = "";
        try { token = localStorage.getItem(KEY) || ""; } catch (e) {}
        if (!token) { show(login); return; }
        show(loading);
        fetch(API + "/api/page/" + page, { headers: { Authorization: "Bearer " + token } })
          .then(function (r) {
            if (r.status === 401) { try { localStorage.removeItem(KEY); } catch (e) {} show(login); return null; }
            if (r.status === 404) { show(notfound); return null; }
            if (!r.ok) { fail("Errore " + r.status + ". Riprova."); return null; }
            return r.text();
          })
          .then(function (html) {
            if (html == null) return;
            document.open();
            document.write(html);
            document.close();
          })
          .catch(function () { fail("Impossibile contattare il server. Riprova."); });
      }

      login.addEventListener("submit", function (ev) {
        ev.preventDefault();
        submit.disabled = true;
        error.hidden = true;
        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;
        fetch(API + "/api/auth/token", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ email: email, password: password })
        })
          .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
          .then(function (res) {
            if (res.status === 200 && res.body.token) {
              try { localStorage.setItem(KEY, res.body.token); } catch (e) {}
              load();
              return;
            }
            var reason = res.body && res.body.error;
            fail(reason === "domain" ? "Usa il tuo indirizzo @timevision.it."
              : reason === "password" ? "Password non corretta."
              : reason === "config" ? "Accesso non ancora configurato. Avvisa il team Innovazione."
              : "Accesso non riuscito. Riprova.");
          })
          .catch(function () { fail("Impossibile contattare il server. Riprova."); });
      });

      load();
    })();
  </script>
</body>
</html>
